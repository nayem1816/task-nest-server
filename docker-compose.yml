# Local development infrastructure. Host ports are shifted off the defaults
# (5432, 6379) so they don't collide with services already running on a dev machine.
name: tasknest

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: tasknest
      POSTGRES_PASSWORD: tasknest
      POSTGRES_DB: tasknest
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tasknest -d tasknest']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. MinIO no longer publishes container images,
  # so RustFS stands in locally; production points at S3 or R2.
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: tasknest
      RUSTFS_SECRET_KEY: tasknest-dev-secret
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  redis-data:
  storage-data:
